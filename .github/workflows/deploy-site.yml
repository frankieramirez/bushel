name: Deploy site

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  deploy-site:
    name: rebuild bushel.sh
    runs-on: "ubuntu-22.04"
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease }}
    steps:
      - name: Trigger the Cloudflare Pages deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.BUSHEL_SH_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::BUSHEL_SH_DEPLOY_HOOK is not set; bushel.sh will serve the previous release's docs.json until someone redeploys it."
            exit 1
          fi
          curl --fail-with-body -sS -X POST "$DEPLOY_HOOK"
          echo
          echo "bushel.sh rebuild queued"

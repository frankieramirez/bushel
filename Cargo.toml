[package]
name = "bushel"
version = "0.3.3"
edition = "2024"
rust-version = "1.85"
description = "A lazydocker-style TUI for Apple Containers"
repository = "https://github.com/frankieramirez/bushel"
homepage = "https://github.com/frankieramirez/bushel"
license = "MIT"
readme = "README.md"
keywords = ["tui", "containers", "macos", "ratatui"]
categories = ["command-line-utilities"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tachyonfx = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "signal"] }
toml = "0.9"
dirs = "6"
futures = "0.3"
async-trait = "0.1.92"
axoupdater = { version = "0.9", default-features = false, features = ["github_releases"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
strip = true

[profile.dist]
inherits = "release"
lto = "thin"
